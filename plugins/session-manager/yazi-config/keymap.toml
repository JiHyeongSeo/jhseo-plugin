# yazi는 cs 대시보드에서 Ctrl+E 팝업으로 실행됨.
# 팝업이므로 세션 관리(Ctrl+S/N/Q/Z)는 대시보드 소관 → 여기선 제거.
# 파일 탐색 기능(Ctrl+J/F/R)만 유지. q 로 팝업 닫기.

# ── cs 파일 탐색 기능 ──────────────────────────────────────
[[mgr.prepend_keymap]]
on = ["<C-j>"]
run = "shell '~/.config/yazi/cs-cd-jump.sh' --block"
desc = "폴더 이동 (fzf)"

[[mgr.prepend_keymap]]
on = ["<C-f>"]
run = "shell ~/.config/yazi/fzf-search.sh --block"
desc = "fzf 파일명 검색"

[[mgr.prepend_keymap]]
on = ["<C-r>"]
run = "shell '~/.config/yazi/rg-search.sh' --block"
desc = "파일 내 텍스트 검색 (ripgrep)"

# ── 불필요 키 비활성화 (실수 방지) ────────────────────────
[[mgr.prepend_keymap]]
on = ["/"]
run = "escape"
desc = "비활성"

